name: post_quantum_crypto
description: >-
  Pure Dart post-quantum cryptography: ML-KEM envelopes and streaming
  encryption, ML-DSA and SLH-DSA signatures, X-Wing hybrid key exchange,
  Argon2id key protection.
version: 2.2.0
repository: https://github.com/Colossus-Services/post_quantum_crypto
issue_tracker: https://github.com/Colossus-Services/post_quantum_crypto/issues

topics:
  - cryptography
  - post-quantum
  - encryption
  - signatures
  - security

environment:
  sdk: ^3.10.0

dependencies:
  cryptography: ^2.9.0
  meta: ^1.19.0
  pointycastle: ^4.0.0
  # Pinned to 0.4.3.x: the SLH-DSA key check imports pqcrypto's non-exported
  # SlhDsaInternal (lib/src/keys/slh_dsa_expanded.dart). Relax to a caret
  # constraint once pqcrypto exports it
  # (https://github.com/turkananation/pqcrypto/pull/69).
  pqcrypto: '>=0.4.3 <0.4.4'

dev_dependencies:
  dependency_validator: ^5.1.0
  lints: ^6.1.0
  test: ^1.33.0
