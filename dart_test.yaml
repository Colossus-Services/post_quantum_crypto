# Pure-Dart post-quantum operations are CPU-heavy; allow slow runners.
timeout: 4x

tags:
  # Official known-answer vectors read from test/vectors/ (VM only: they are
  # loaded with dart:io). test/browser/ carries an embedded subset for the web.
  vectors:
  # Cross-implementation tests against an OpenSSL >= 3.5 binary. They
  # self-skip when no suitable OpenSSL is found (see test/interop/).
  interop:
  # Seeded mutation fuzzing of every parser.
  fuzz:
  # Long-running tests (large files, SLH-DSA signing).
  slow:
  # The `version` tag marks the test asserting postQuantumCryptoVersion matches
  # pubspec.yaml (test/unit/misc_test.dart).
  version:
  # Tests that run in browsers (dart2js and dart2wasm).
  browser:
  # Tests that touch the file system, file permissions, processes or
  # isolates, so their behavior can differ by OS; CI runs these on macOS and
  # Windows too.
  platform:
