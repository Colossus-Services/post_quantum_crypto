name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same PR or branch supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs in parallel; the slowest one sets the wall time.
jobs:
  # Formatting, static analysis and dependency hygiene.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: dart format
        run: dart format -o none --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dependency_validator
        run: dart run dependency_validator

  # What users get: API docs, the publishable package and the examples.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      # The examples are independent programs; run them concurrently.
      - name: Run examples
        run: |
          ls example/*.dart | xargs -P 4 -I{} sh -c \
            'dart run "{}" > /dev/null && echo "ok: {}" || { echo "FAILED: {}"; exit 255; }'
      - name: dart doc
        run: dart doc --dry-run
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  # The VM suite with coverage, in four shards of similar length: the
  # known-answer vectors and the rest (partitioned by tag), each split in
  # two by `dart test` sharding. Together with test_slow every test runs
  # exactly once. Codecov merges the four uploads (codecov.yml:
  # after_n_builds). The OpenSSL interop tests have their own job below.
  test_vm:
    strategy:
      fail-fast: false
      matrix:
        group: [vectors, core]
        index: [0, 1]
        include:
          - group: vectors
            selector: -t vectors -x slow -x interop
          - group: core
            selector: -x vectors -x slow -x interop
    name: test_vm (${{ matrix.group }} ${{ matrix.index }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Run tests (VM)
        run: >-
          dart test --platform vm ${{ matrix.selector }}
          --total-shards 2 --shard-index ${{ matrix.index }}
          --coverage=./coverage
      # Upload even when tests fail, so Codecov always receives all four
      # shards (codecov.yml: after_n_builds) and never waits forever.
      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: false
          verbose: true

  # The few `slow` tests (large files, SLH-DSA signing), without coverage:
  # instrumentation slows their hot loops several times over, and every
  # line they reach is also covered by the shards above.
  test_slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Run slow tests (VM)
        run: dart test --platform vm -t slow -x interop

  # Platform-independent suite (embedded vectors, byte-identical
  # serialization, workflows) compiled to JavaScript and to WebAssembly.
  # Chrome is preinstalled on the Ubuntu runner image.
  test_web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Run tests (Chrome, dart2js)
        run: dart test -p chrome test/browser
      - name: Run tests (Chrome, dart2wasm)
        run: dart test -p chrome -c dart2wasm test/browser

  # Cross-implementation tests against OpenSSL >= 3.5 (ML-KEM, ML-DSA,
  # SLH-DSA). Ubuntu runners ship OpenSSL 3.0, so Homebrew's OpenSSL 3 on
  # macOS is used.
  test_interop:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install OpenSSL 3
        run: |
          brew install openssl@3
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: OpenSSL version
        run: $OPENSSL version
      - name: Install dependencies
        run: dart pub get
      # Fails (instead of skipping) when the OpenSSL found lacks ML-KEM.
      - name: Run interop tests
        run: dart test -t interop -r expanded
        env:
          QC_REQUIRE_OPENSSL: 'true'

  # Other operating systems: the `platform` tests (file system, file
  # permissions, processes, isolates). Everything else is pure Dart
  # computation, identical on every OS, and already runs on Linux and in
  # browsers.
  test_os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test -t platform -x interop -x slow
